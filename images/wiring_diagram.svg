<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Loma, 'Noto Sans Thai', 'Sarabun', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ผังการต่อวงจร IoT DC Power Meter</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c3c3c"/>
    </marker>
  </defs>

  <rect width="820" height="400" fill="#ffffff"/>

  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">ผังการต่อวงจร — IoT DC Power Meter</text>

  <!-- ESP32 -->
  <rect x="300" y="62" width="220" height="66" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="2"/>
  <text x="410" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">ESP32</text>
  <text x="410" y="112" text-anchor="middle" font-size="12" fill="#6e6e6e">ประมวลผลและเว็บเซิร์ฟเวอร์</text>

  <!-- I2C link -->
  <line x1="410" y1="128" x2="410" y2="214" stroke="#3c3c3c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="428" y="150" font-size="12" fill="#1a1a1a">SDA → GPIO 21</text>
  <text x="428" y="172" font-size="12" fill="#1a1a1a">SCL → GPIO 22</text>
  <text x="428" y="194" font-size="12" fill="#1a1a1a">VCC → 3.3V , GND → GND</text>

  <!-- power path -->
  <rect x="40" y="216" width="220" height="76" rx="8" fill="#f3f3f3" stroke="#969696" stroke-width="2"/>
  <text x="150" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">อะแดปเตอร์</text>
  <text x="150" y="270" text-anchor="middle" font-size="12" fill="#6e6e6e">12V 2A</text>

  <rect x="300" y="216" width="220" height="76" rx="8" fill="#ffebee" stroke="#e57373" stroke-width="2"/>
  <text x="410" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">INA219</text>
  <text x="410" y="270" text-anchor="middle" font-size="12" fill="#6e6e6e">ชันต์ 0.1 Ω</text>

  <rect x="560" y="216" width="220" height="76" rx="8" fill="#f3f3f3" stroke="#969696" stroke-width="2"/>
  <text x="670" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">โหลด</text>
  <text x="670" y="270" text-anchor="middle" font-size="12" fill="#6e6e6e">หลอดไฟ / มอเตอร์</text>

  <line x1="260" y1="254" x2="296" y2="254" stroke="#3c3c3c" stroke-width="2" marker-end="url(#head)"/>
  <text x="279" y="208" text-anchor="middle" font-size="12" fill="#6e6e6e">Vin+</text>
  <line x1="520" y1="254" x2="556" y2="254" stroke="#3c3c3c" stroke-width="2" marker-end="url(#head)"/>
  <text x="539" y="208" text-anchor="middle" font-size="12" fill="#6e6e6e">Vin−</text>

  <!-- ground return -->
  <path d="M670 292 L670 345 L150 345 L150 296" fill="none" stroke="#3c3c3c" stroke-width="2" marker-end="url(#head)"/>
  <text x="410" y="362" text-anchor="middle" font-size="12" fill="#6e6e6e">กราวด์ร่วม</text>

  <text x="410" y="388" text-anchor="middle" font-size="12" fill="#6e6e6e">เส้นทึบ คือเส้นทางกระแสที่ถูกวัด   เส้นประ คือสัญญาณและไฟเลี้ยง</text>
</svg>
