<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" font-family="Loma, 'Noto Sans Thai', 'Sarabun', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ตารางการต่อขา IoT DC Power Meter</title>
  <rect width="700" height="620" fill="#ffffff"/>

  <text x="350" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">ตารางการต่อขา — IoT DC Power Meter</text>

  <!-- section 1 -->
  <text x="50" y="76" font-size="13" font-weight="700" fill="#7e57c2">ฝั่งสัญญาณ — บัส I2C</text>

  <rect x="50" y="88" width="600" height="38" fill="#f2f2f2"/>
  <text x="66" y="113" font-size="13" font-weight="700" fill="#1a1a1a">ขา INA219</text>
  <text x="346" y="113" font-size="13" font-weight="700" fill="#1a1a1a">ต่อเข้า ESP32</text>

  <rect x="50" y="126" width="600" height="38" fill="#ffffff"/>
  <text x="66" y="151" font-size="13" fill="#1a1a1a">VCC</text>
  <text x="346" y="151" font-size="13" fill="#1a1a1a">3.3V</text>

  <rect x="50" y="164" width="600" height="38" fill="#fafafa"/>
  <text x="66" y="189" font-size="13" fill="#1a1a1a">GND</text>
  <text x="346" y="189" font-size="13" fill="#1a1a1a">GND</text>

  <rect x="50" y="202" width="600" height="38" fill="#ffffff"/>
  <text x="66" y="227" font-size="13" fill="#1a1a1a">SDA</text>
  <text x="346" y="227" font-size="13" fill="#1a1a1a">GPIO 21</text>

  <rect x="50" y="240" width="600" height="38" fill="#fafafa"/>
  <text x="66" y="265" font-size="13" fill="#1a1a1a">SCL</text>
  <text x="346" y="265" font-size="13" fill="#1a1a1a">GPIO 22</text>

  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="50" y1="126" x2="650" y2="126"/>
    <line x1="50" y1="164" x2="650" y2="164"/>
    <line x1="50" y1="202" x2="650" y2="202"/>
    <line x1="50" y1="240" x2="650" y2="240"/>
    <line x1="330" y1="88" x2="330" y2="278"/>
  </g>
  <rect x="50" y="88" width="600" height="190" fill="none" stroke="#bebebe" stroke-width="2"/>

  <!-- section 2 -->
  <text x="50" y="332" font-size="13" font-weight="700" fill="#e57373">ฝั่งไฟที่ถูกวัด — ต่ออนุกรม</text>

  <rect x="50" y="344" width="600" height="38" fill="#f2f2f2"/>
  <text x="66" y="369" font-size="13" font-weight="700" fill="#1a1a1a">จาก</text>
  <text x="346" y="369" font-size="13" font-weight="700" fill="#1a1a1a">ไปยัง</text>

  <rect x="50" y="382" width="600" height="38" fill="#ffffff"/>
  <text x="66" y="407" font-size="13" fill="#1a1a1a">ขั้วบวกอะแดปเตอร์</text>
  <text x="346" y="407" font-size="13" fill="#1a1a1a">Vin+ ของ INA219</text>

  <rect x="50" y="420" width="600" height="38" fill="#fafafa"/>
  <text x="66" y="445" font-size="13" fill="#1a1a1a">Vin− ของ INA219</text>
  <text x="346" y="445" font-size="13" fill="#1a1a1a">ขั้วบวกของโหลด</text>

  <rect x="50" y="458" width="600" height="38" fill="#ffffff"/>
  <text x="66" y="483" font-size="13" fill="#1a1a1a">ขั้วลบของโหลด</text>
  <text x="346" y="483" font-size="13" fill="#1a1a1a">ขั้วลบอะแดปเตอร์</text>

  <rect x="50" y="496" width="600" height="38" fill="#fafafa"/>
  <text x="66" y="521" font-size="13" fill="#1a1a1a">ขั้วลบอะแดปเตอร์</text>
  <text x="346" y="521" font-size="13" fill="#1a1a1a">GND ของ ESP32</text>

  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="50" y1="382" x2="650" y2="382"/>
    <line x1="50" y1="420" x2="650" y2="420"/>
    <line x1="50" y1="458" x2="650" y2="458"/>
    <line x1="50" y1="496" x2="650" y2="496"/>
    <line x1="330" y1="344" x2="330" y2="534"/>
  </g>
  <rect x="50" y="344" width="600" height="190" fill="none" stroke="#bebebe" stroke-width="2"/>

  <text x="50" y="568" font-size="11" fill="#6e6e6e">เซนเซอร์ต่ออนุกรมในเส้นทางไฟ ไม่ใช่ต่อคร่อมแบบโวลต์มิเตอร์</text>
  <text x="50" y="588" font-size="11" fill="#6e6e6e">แถวสุดท้ายคือกราวด์ร่วม ขาดไม่ได้ มิฉะนั้นค่าแรงดันที่อ่านได้จะไม่มีจุดอ้างอิง</text>
</svg>
